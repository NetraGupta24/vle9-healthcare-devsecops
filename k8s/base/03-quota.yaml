# Resource guard rails (availability is part of security: a runaway or
# compromised workload must not starve the node). Applied ONCE by the admin.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: healthcare-quota
  namespace: healthcare
spec:
  hard:
    pods: "10"
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.cpu: "2"
    limits.memory: 2Gi
    services.nodeports: "1"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: healthcare-defaults
  namespace: healthcare
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 512Mi
