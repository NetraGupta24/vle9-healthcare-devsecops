# Step 7 - Kubernetes Secrets: EXAMPLE ONLY. Do NOT apply this file and do NOT
# commit a real Secret manifest to Git.
#
# The handout's example looks like this:
#
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: db-secret
#   type: Opaque
#   data:
#     password: cGFzc3dvcmQ=
#
# Two problems with that in a healthcare system:
#   1. base64 is an ENCODING, not encryption:  echo cGFzc3dvcmQ= | base64 -d  -> "password"
#      Anyone who can read the file (or the Git history) has the secret.
#   2. "password" is a weak, guessable value.
#
# What this project does instead:
#   * scripts/generate-app-secrets.sh creates strong random values in a local
#     file outside the repo (chmod 600).
#   * That file is stored in Jenkins as a "Secret file" credential
#     (id: medsecure-app-secrets). Jenkins masks it in logs.
#   * The pipeline turns it into the Secret below with
#       kubectl create secret generic patient-api-secrets --from-env-file=... \
#         --dry-run=client -o yaml | kubectl apply -f -
#   * Only the jenkins-deployer ServiceAccount may read/update this one Secret
#     (k8s/base/01-rbac.yaml), and pods get it as environment variables.
#   * minikube is started with an EncryptionConfiguration so Secrets are
#     encrypted (AES-CBC) inside etcd, not just base64 encoded
#     (scripts/ec2/03-start-minikube.sh).
#
# Shape of the real Secret (placeholder values):
apiVersion: v1
kind: Secret
metadata:
  name: patient-api-secrets
  namespace: healthcare
type: Opaque
stringData:
  JWT_SECRET: "<64 random hex chars: openssl rand -hex 32>"
  PHI_ENCRYPTION_KEY: "<32 random bytes, base64: openssl rand -base64 32>"
  DOCTOR_PASSWORD: "<random, 12+ chars>"
  NURSE_PASSWORD: "<random, 12+ chars>"
  RECEPTIONIST_PASSWORD: "<random, 12+ chars>"
