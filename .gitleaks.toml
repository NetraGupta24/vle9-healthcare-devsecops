# Gitleaks configuration: the full default rule set (AWS keys, GitHub tokens,
# private keys, JWTs, generic API keys, ...) plus a project rule for the PHI
# encryption key. Nothing is allow-listed except the placeholder example file.
title = "medsecure gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "medsecure-phi-encryption-key"
description = "Hardcoded PHI encryption key (base64, 32 bytes)"
regex = '''PHI_ENCRYPTION_KEY\s*[:=]\s*["']?[A-Za-z0-9+/]{43}=["']?'''
keywords = ["phi_encryption_key"]

[allowlist]
description = "Documented placeholders only"
paths = ['''k8s/secret\.example\.yaml''']
