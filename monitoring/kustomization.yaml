# kubectl apply -k monitoring/   (after the kube-prometheus-stack Helm chart)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - mailpit.yaml
  - servicemonitor.yaml
  - prometheus-rules.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: medsecure-grafana-dashboard
    files:
      - grafana/medsecure-security-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: MedSecure
