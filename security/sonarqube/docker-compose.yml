# Step 2/4 - SonarQube Community Build + PostgreSQL on the EC2 host.
# Started by scripts/ec2/02-start-sonarqube.sh, which writes the DB password
# into security/sonarqube/.env (git-ignored, mode 600).
#
# Port 9000 is published on the host; the EC2 security group only allows it
# from your own IP address.
name: sonarqube

services:
  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?run scripts/ec2/02-start-sonarqube.sh}
      # Keep the three JVMs small enough for a 8 GiB host shared with Jenkins + minikube.
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAOPTS: "-Xmx768m -Xms128m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx512m -Xms512m"
      SONAR_TELEMETRY_ENABLE: "false"
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
    mem_limit: 2560m
    networks: [sonar]

  db:
    image: postgres:17-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?run scripts/ec2/02-start-sonarqube.sh}
      POSTGRES_DB: sonar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 5s
      retries: 20
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    mem_limit: 384m
    networks: [sonar] # not published: only SonarQube can reach the database

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_db:

networks:
  sonar:
