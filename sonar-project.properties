# Step 4 - SonarQube static analysis (SAST) settings, read by sonar-scanner.
sonar.projectKey=medsecure-patient-api
sonar.projectName=MedSecure Patient API (VLE-9)
sonar.sourceEncoding=UTF-8

# Application code + Infrastructure-as-Code (SonarQube also has security
# rules for Dockerfiles, Kubernetes manifests and Terraform).
sonar.sources=app/src,app/public,Dockerfile,k8s,infra/terraform
sonar.tests=app/test
sonar.exclusions=**/node_modules/**,app/coverage/**,**/.terraform/**
sonar.coverage.exclusions=app/public/**,app/src/server.js,app/src/healthcheck.js,k8s/**,infra/**,Dockerfile

# Coverage produced by `npm run test:coverage` (scripts/ci/unit-tests.sh).
sonar.javascript.lcov.reportPaths=app/coverage/lcov.info
